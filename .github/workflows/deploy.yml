name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/medusa-backend
            git pull origin main
            npm install
            cd apps/backend
            npm run build
            cp .env .medusa/server/.env
            ln -sf /opt/medusa-backend/apps/backend/static /opt/medusa-backend/apps/backend/.medusa/server/static
            pm2 restart medusa --update-env
