name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server
        run: |
          curl -X POST https://api.techpilots.se/deploy \
            -H "X-Deploy-Token: techpilots-deploy-2026" \
            -H "Content-Type: application/json" \
            -d '{"ref":"refs/heads/main"}'
