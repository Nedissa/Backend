name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server
        run: |
          curl -X POST https://api.techpilots.se/deploy \
            -H "X-Hub-Signature-256: sha256=$(echo -n '${{ github.sha }}' | openssl dgst -sha256 -hmac 'techpilots-deploy-2026' | awk '{print $2}')" \
            -H "Content-Type: application/json" \
            -d '{"ref":"refs/heads/main","after":"${{ github.sha }}"}'
